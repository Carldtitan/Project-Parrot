name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: npm ci
      - run: npm test
      - run: python -m pip install numpy
      - run: python -m unittest scripts.test_stt_worker scripts.test_cleanup_pipeline
      - run: python -m compileall -q parrot scripts
