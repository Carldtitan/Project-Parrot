name: Publish latest Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parrot-latest-windows
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish Parrot.exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pyinstaller

      - name: Verify source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          npm test
          npm run test:e2e
          python -m unittest scripts.test_stt_worker scripts.test_cleanup_pipeline
          python -m compileall -q parrot scripts

      - name: Build Windows installer
        shell: pwsh
        run: |
          .\scripts\package_desktop.ps1 `
            -UseSystemPython `
            -SkipPythonInstall `
            -SkipNpmInstall

          $installer = Get-ChildItem -LiteralPath release -Filter "*.exe" |
            Where-Object { $_.Name -ne "Parrot.exe" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The Windows installer was not produced."
          }

          Copy-Item -LiteralPath $installer.FullName -Destination "release\Parrot.exe"
          $hash = (Get-FileHash -LiteralPath "release\Parrot.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Parrot.exe" | Set-Content -LiteralPath "release\Parrot.exe.sha256" -Encoding ascii

      - name: Keep an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parrot-Windows-${{ github.sha }}
          path: |
            release/Parrot.exe
            release/Parrot.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the permanent latest download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @"
          This is the newest verified Windows build of Parrot.

          Commit: $env:GITHUB_SHA

          Parrot transcribes locally. The speech model downloads on first launch,
          and the optional Ollama formatter can be installed later from Preferences.
          "@ | Set-Content -LiteralPath "release\latest-notes.md" -Encoding utf8

          gh release view latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/latest" `
              -f sha="$env:GITHUB_SHA" `
              -F force=true
            gh release edit latest `
              --repo $env:GITHUB_REPOSITORY `
              --title "Parrot — latest Windows build" `
              --notes-file "release\latest-notes.md" `
              --latest
          } else {
            gh release create latest `
              --repo $env:GITHUB_REPOSITORY `
              --target "$env:GITHUB_SHA" `
              --title "Parrot — latest Windows build" `
              --notes-file "release\latest-notes.md" `
              --latest
          }

          gh release upload latest `
            "release\Parrot.exe" `
            "release\Parrot.exe.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
